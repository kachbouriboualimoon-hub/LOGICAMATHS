            </div>

                <span class="current-time" id="currentTime">00:00</span>
                <div class="progress-track" id="progressTrack">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="total-time" id="totalTime">00:00</span>
            </div>

            <!-- ===== CONTROLES AVEC RÉPÉTER ET SHUFFLE ===== -->
            <div class="controls">
                <button id="repeatBtn" title="Répéter" class="ctrl-btn repeat-btn">🔁</button>
                <button id="prevBtn" title="Piste précédente" class="ctrl-btn prev-btn">⏮️</button>
                <button id="playBtn" title="Lecture / Pause" class="ctrl-btn play-btn">▶️</button>
                <button id="nextBtn" title="Piste suivante" class="ctrl-btn next-btn">⏭️</button>
                <button id="shuffleBtn" title="Mélanger" class="ctrl-btn shuffle-btn">🔀</button>
            </div>

                <div class="about-right">
                    <span class="about-label">Plateforme</span>
